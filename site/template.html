<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
$if(description)$
  <meta name="description" content="$description$">
$endif$
  <title>offsecnotes$if(title)$ | $title$$endif$</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@exampledev/new.css@1.1.2/new.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" media="(prefers-color-scheme: light)" data-theme-css="light">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" media="(prefers-color-scheme: dark)" data-theme-css="dark">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Theme: saved choice (light/dark) or, if none, the system preference.
    // Runs before the page is drawn, so there's no flash of the wrong theme.
    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      document.querySelectorAll("link[data-theme-css]").forEach(function (link) {
        link.media = link.dataset.themeCss === theme ? "all" : "not all";
      });
    }
    function toggleTheme() {
      var current = document.documentElement.dataset.theme ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var next = current === "dark" ? "light" : "dark";
      setTheme(next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    }
    try { var saved = localStorage.getItem("theme"); if (saved) setTheme(saved); } catch (e) {}
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/go.min.js"></script>
  <script>hljs.highlightAll();</script>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>offsecnotes</h1>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle light/dark theme" title="Toggle theme"></button>
    </div>
    <nav>
      <a href="/">Home</a> • <a href="/Android/">Android</a> • <a href="/Web/">Web</a> •
      <a href="/Network/">Network</a> • <a href="/Linux/">Linux</a> •
      <a href="/Windows/">Windows</a> • <a href="/Misc/">Misc</a>
    </nav>
  </header>
$if(title)$
  <h1>$title$</h1>
$endif$
$if(table-of-contents)$
  <span>by frankheat</span>
  <div class="toc">$table-of-contents$</div>
  <hr>
$endif$
$body$
  <hr>
  <footer>
    <p align="center">
      <a href="https://github.com/frankheat/offsecnotes">Source code</a> •
      <a href="https://github.com/frankheat">frankheat</a>
    </p>
  </footer>
</body>
</html>
